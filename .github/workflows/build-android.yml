name: Build Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  # ID iklan diambil dari GitHub: Settings > Secrets and variables > Actions > Variables.
  # Kalau belum diisi, otomatis pakai ID TEST resmi Google.
  ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID || 'ca-app-pub-3940256099942544~3347511713' }}
  ADMOB_INTERSTITIAL_ID: ${{ vars.ADMOB_INTERSTITIAL_ID || 'ca-app-pub-3940256099942544/1033173712' }}
  ADMOB_REWARDED_ID: ${{ vars.ADMOB_REWARDED_ID || 'ca-app-pub-3940256099942544/5224354917' }}
  ADMOB_TESTING: ${{ vars.ADMOB_TESTING || 'true' }}
  # true kalau secret keystore sudah diisi -> ikut build APK/AAB release yang ditandatangani
  HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Tulis ads-config.js
        run: |
          case "$ADMOB_TESTING" in
            true|false) ;;
            *) echo "ADMOB_TESTING harus true atau false"; exit 1 ;;
          esac
          cat > www/ads-config.js <<EOF
          window.SQ_ADS = {
            testing: $ADMOB_TESTING,
            interstitialId: "$ADMOB_INTERSTITIAL_ID",
            rewardedId: "$ADMOB_REWARDED_ID"
          };
          EOF
          cat www/ads-config.js

      - name: Buat project Android
        run: |
          [ -d android ] || npx cap add android

      - name: Patch Android (AdMob ID, landscape, fullscreen)
        run: python3 scripts/patch_android.py

      - name: Icon dan splash
        continue-on-error: true
        run: |
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000' \
            --splashBackgroundColor '#000000' --splashBackgroundColorDark '#000000'

      - name: Sync web assets
        run: npx cap sync android

      - name: Set versi
        run: |
          sed -i "s/versionCode [0-9][0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Build APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release (belum ditandatangani)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Tandatangani release
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash scripts/sign.sh

      - name: Upload APK debug
        uses: actions/upload-artifact@v4
        with:
          name: BlockZone-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload release (APK TapTap + AAB Play Store)
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: BlockZone-release-signed
          path: out/*
