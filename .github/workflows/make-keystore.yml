name: Generate Keystore (sekali aja)

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Bikin keystore
        run: |
          mkdir out
          PASS=$(openssl rand -hex 12)
          keytool -genkeypair -v \
            -keystore out/release.keystore -storetype PKCS12 \
            -alias squarezone -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Square Zone"
          base64 -w0 out/release.keystore > out/KEYSTORE_BASE64.txt
          {
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_ALIAS=squarezone"
            echo "KEY_PASSWORD=$PASS"
          } > out/SECRETS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: keystore-SIMPAN-JANGAN-HILANG
          path: out/
          retention-days: 3
