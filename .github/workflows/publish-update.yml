name: Publish Game Update

# Tiap game.html berubah di branch utama, versi barunya dipublikasikan ke GitHub Pages.
# Aplikasi di HP pemain otomatis mengunduhnya saat dibuka (atau lewat Pengaturan > PEMBARUAN).
# Syarat sekali saja: repo Settings > Pages > Source = "GitHub Actions".
# (Repo private butuh GitHub Pro/Team untuk Pages. Alternatif gratis: Vercel, lihat README.)

on:
  push:
    branches: [main, master]
    paths:
      - 'www/game.html'
      - 'scripts/make-update.mjs'
      - '.github/workflows/publish-update.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bikin paket update
        run: node scripts/make-update.mjs --update

      # Mirror ke branch update-pkg -> otomatis tersedia juga lewat
      # raw.githubusercontent.com/REPO/update-pkg/ dan cdn.jsdelivr.net/gh/REPO@update-pkg/
      # (cadangan kalau GitHub Pages tidak terjangkau dari jaringan pemain).
      - name: Cermin paket ke branch update-pkg
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd update
          git init -q -b update-pkg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Paket update ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:$TOKEN@github.com/${GITHUB_REPOSITORY}.git" update-pkg

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: update

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
